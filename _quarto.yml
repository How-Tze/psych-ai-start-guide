lang: zh-CN
project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - chapters/*.qmd
    - products/*.qmd
    - appendices/api-tools.qmd
    - docs/versioning.qmd
  resources:
    - /examples/learning/*.csv
    - /examples/project/*.txt
    - /examples/api-batch/batch_label.py
    - /examples/api-batch/test_batch_label.py
    - /examples/api-batch/input_responses.csv
    - /examples/api-batch/requirements.txt
    - /examples/api-batch/README.md
    - /examples/vibe-coding/data-viewer.html
    - /examples/vibe-coding/research-viewer.zip
    - /examples/vibe-coding/README.md
website:
  title: "心理学研究者的 AI Start Guide"
  description: "开通与选购、科研任务教程，以及按需使用的 API 和代码代理。"
  site-url: https://How-Tze.github.io/psych-ai-start-guide/
  repo-url: https://github.com/How-Tze/psych-ai-start-guide
  page-navigation: true
  search: true
  navbar:
    left:
      - href: index.qmd
        text: 首页
      - href: chapters/accounts.qmd
        text: 开通与选购
      - href: chapters/01-task-map.qmd
        text: 按任务开始
      - href: products/index.qmd
        text: 产品速查
      - href: chapters/06-api-basics.qmd
        text: API 与进阶
    right:
      - href: docs/versioning.qmd
        text: 版本说明
  sidebar:
    - title: "Start Guide"
      style: "docked"
      search: true
      contents:
        - index.qmd
        - section: "开通与选购"
          contents:
            - chapters/accounts.qmd
            - chapters/budget.qmd
            - chapters/00-start-now.qmd
        - section: "按科研任务开始"
          contents:
            - chapters/01-task-map.qmd
            - chapters/02-chat-first-task.qmd
            - chapters/method-learning.qmd
            - chapters/04-reading-papers.qmd
            - chapters/05-deep-research.qmd
            - chapters/research-design.qmd
            - chapters/data-analysis.qmd
            - chapters/academic-writing.qmd
            - chapters/03-project-workspace.qmd
            - chapters/qualitative-research.qmd
        - section: "代码、API 与多步任务（按需）"
          contents:
            - chapters/10-code-agent.qmd
            - chapters/vibe-coding.qmd
            - chapters/tool-connections.qmd
            - chapters/06-api-basics.qmd
            - chapters/07-api-first-setup.qmd
            - chapters/08-api-costs.qmd
            - chapters/09-api-research-script.qmd
            - chapters/11-work-agent.qmd
            - appendices/api-tools.qmd
        - section: "隐私与练习检查"
          contents:
            - chapters/12-privacy.qmd
            - chapters/13-checklist.qmd
        - section: "产品速查"
          contents:
            - products/index.qmd
            - products/chatgpt.qmd
            - products/claude.qmd
            - products/gemini.qmd
            - products/deepseek.qmd
            - products/kimi.qmd
            - products/qwen.qmd
            - products/doubao.qmd
            - products/glm.qmd
            - products/workbuddy.qmd
            - products/cursor.qmd
            - products/research-tools.qmd
        - docs/versioning.qmd
format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    anchor-sections: true
    link-external-newwindow: true
execute:
  freeze: auto
